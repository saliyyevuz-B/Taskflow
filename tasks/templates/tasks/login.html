
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kirish | TaskFlow</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6fb;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 32px;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
        }

        .logo {
            color: #4f46e5;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 24px;
        }

        h2 {
            font-size: 23px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .field {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus {
            outline: 2px solid #c7d2fe;
            border-color: #6366f1;
        }

        .submit-btn {
            width: 100%;
            padding: 13px;
            background: #4f46e5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #4338ca;
        }

        .error {
            color: #b91c1c;
            font-size: 13px;
            margin-bottom: 15px;
        }

        .register-link {
            margin-top: 22px;
            text-align: center;
            font-size: 14px;
            color: #64748b;
        }

        a {
            color: #4f46e5;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="login-card">

        <div class="logo">TaskFlow</div>

        <h2>Xush kelibsiz!</h2>

        <p class="subtitle">
            Akkauntingizga kiring va vazifalaringizni
            boshqarishni davom ettiring.
        </p>

        {% if form.errors %}
            <div class="error">
                Username yoki parol noto‘g‘ri.
                Qayta urinib ko‘ring.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}

            <div class="field">
                <label for="id_username">Username</label>

                <input
                    type="text"
                    name="username"
                    id="id_username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="field">
                <label for="id_password">Parol</label>

                <input
                    type="password"
                    name="password"
                    id="id_password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="submit-btn">
                Tizimga kirish
            </button>
        </form>

        <div class="register-link">
            Akkauntingiz yo‘qmi?
            <a href="{% url 'register' %}">
                Ro‘yxatdan o‘tish
            </a>
        </div>

    </div>

</body>
</html>
