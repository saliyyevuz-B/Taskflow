
<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vazifani tahrirlash | TaskFlow</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f3f5f9;
            color: #1e293b;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 32px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.07);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 8px;
            font-size: 26px;
        }

        .subtitle {
            margin-bottom: 28px;
            color: #64748b;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #dbe1ea;
            border-radius: 9px;
            font-size: 15px;
            font-family: inherit;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #4f46e5;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4338ca;
        }

        .back {
            display: block;
            margin-top: 18px;
            text-align: center;
            color: #64748b;
            text-decoration: none;
        }

        .back:hover {
            color: #4f46e5;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Vazifani tahrirlash</h1>
        <p class="subtitle">Vazifangiz ma'lumotlarini yangilang.</p>

        <form method="POST">
            {% csrf_token %}

            <label for="title">Vazifa nomi</label>
            <input
                type="text"
                id="title"
                name="title"
                value="{{ task.title }}"
                required
            >

            <label for="description">Tavsif</label>
            <textarea
                id="description"
                name="description"
            >{{ task.description }}</textarea>

            <button type="submit">O'zgarishlarni saqlash</button>
        </form>

        <a class="back" href="{% url 'home' %}">← Bosh sahifaga qaytish</a>
    </div>
</body>
</html>
